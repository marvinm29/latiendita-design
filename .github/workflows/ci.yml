name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint · tipos · tests · build · size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        # Usa "packageManager" del package.json raíz

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint flat config)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Presupuesto de tamaño (JS+CSS gzip ≤ 150 KiB)
        run: pnpm size

      # M0: Lighthouse CI se conecta cuando el shell tenga bundles estables
      # (003 §8 · 004 M0). El gate de tamaño ya es real en scripts/size.mjs.
      # - name: Lighthouse CI
      #   uses: treosh/lighthouse-ci-action@v12

  e2e:
    name: e2e offline C2–C5 · WCAG AA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium (Playwright)
        run: pnpm --filter @latiendita/web exec playwright install --with-deps chromium

      - name: e2e (sin red + axe)
        run: pnpm --filter @latiendita/web test:e2e

      - name: Guardar trazas si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7

  postgres-sync:
    name: PostgreSQL 16 · bitácora sync y RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: latiendita_test
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: latiendita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latiendita_test -d latiendita_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Pruebas de API con PostgreSQL
        env:
          SYNC_TEST_PG: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: latiendita_test
          PGPASSWORD: prueba
          PGDATABASE: latiendita_test
        run: pnpm --filter @latiendita/api test
